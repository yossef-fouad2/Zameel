name: zameel
description: Production-ready Flutter scaffold generated by the wizard.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^17.1.0

  # Networking
  internet_connection_checker_plus: ^2.9.1+2

  # State Management
  fpdart: ^1.2.0
  equatable: ^2.0.7
  flutter_hooks: ^0.21.3+1
  flutter_bloc: ^9.1.1

  # Backend – Firebase

  # Backend – Supabase
  supabase_flutter: ^2.12.0

  # Backend – Appwrite

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Images & SVG
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4

  # Icons
  hugeicons: ^1.1.5

  # Shimmer / Skeleton
  skeletonizer: ^2.1.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1

  # Environment
  flutter_dotenv: ^6.0.0

  # Logging
  logger: ^2.6.2

  # Media
  image_picker: ^1.2.1

  # Utilities
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1

  # Device & System
  device_info_plus: ^11.2.0
  app_version_update: ^6.2.0

  # Localization
  easy_localization: ^3.0.8

  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0 # SDK transport fakes in auth tests; no production HTTP layer.

  # Code Generation

dependency_overrides:

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/fonts/plus_jakarta_sans/OFL.txt
    - assets/fonts/ibm_plex_sans_arabic/OFL.txt
    - .env

  # Unmodified TTFs and OFL licenses from https://github.com/google/fonts
  # at commit 1d0e46c7933245c8180fe83e47917961c913bbdb:
  # ofl/plusjakartasans and ofl/ibmplexsansarabic. No runtime font downloads.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        # Source: PlusJakartaSans[wght].ttf, renamed without changing its bytes.
        # Variable wght axis 200-800; do not pin this asset to one weight.
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
